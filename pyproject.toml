[project]
name = "dropline"
version = "0.1.0"
description = "Dropship order platform API"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are pinned in requirements.txt; dev tools in requirements-dev.txt.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dropline.settings"
testpaths = ["tests", "apps"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["dropline", "apps"]
